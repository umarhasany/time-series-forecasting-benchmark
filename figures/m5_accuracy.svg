<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640">
  <rect width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">M5 Accuracy: The Winner Depends on the Metric</text>
  <text x="500" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#6b7280">Each panel is independently scaled; lower is better</text>

  <!-- sMAPE panel -->
  <rect x="60" y="110" width="880" height="140" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="85" y="140" font-family="Arial" font-size="18" font-weight="700" fill="#111827">sMAPE (%)</text>
  <text x="85" y="164" font-family="Arial" font-size="13" fill="#6b7280">Best: ETS</text>
  <rect x="250" y="135" width="430" height="22" rx="4" fill="#2563eb"/>
  <rect x="250" y="170" width="435" height="22" rx="4" fill="#16a34a"/>
  <rect x="250" y="205" width="500" height="22" rx="4" fill="#f59e0b"/>
  <text x="690" y="151" font-family="Arial" font-size="13" fill="#111827">ETS 139.46</text>
  <text x="695" y="186" font-family="Arial" font-size="13" fill="#111827">LightGBM 141.22</text>
  <text x="760" y="221" font-family="Arial" font-size="13" fill="#111827">Chronos-2 162.30</text>

  <!-- WAPE panel -->
  <rect x="60" y="270" width="880" height="140" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="85" y="300" font-family="Arial" font-size="18" font-weight="700" fill="#111827">WAPE (%)</text>
  <text x="85" y="324" font-family="Arial" font-size="13" fill="#6b7280">Best: Chronos-2</text>
  <rect x="250" y="295" width="450" height="22" rx="4" fill="#2563eb"/>
  <rect x="250" y="330" width="470" height="22" rx="4" fill="#16a34a"/>
  <rect x="250" y="365" width="405" height="22" rx="4" fill="#f59e0b"/>
  <text x="710" y="311" font-family="Arial" font-size="13" fill="#111827">ETS 75.59</text>
  <text x="730" y="346" font-family="Arial" font-size="13" fill="#111827">LightGBM 78.85</text>
  <text x="665" y="381" font-family="Arial" font-size="13" fill="#111827">Chronos-2 67.90</text>

  <!-- RMSE panel -->
  <rect x="60" y="430" width="880" height="140" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="85" y="460" font-family="Arial" font-size="18" font-weight="700" fill="#111827">RMSE</text>
  <text x="85" y="484" font-family="Arial" font-size="13" fill="#6b7280">Best: LightGBM</text>
  <rect x="250" y="455" width="500" height="22" rx="4" fill="#2563eb"/>
  <rect x="250" y="490" width="452" height="22" rx="4" fill="#16a34a"/>
  <rect x="250" y="525" width="456" height="22" rx="4" fill="#f59e0b"/>
  <text x="760" y="471" font-family="Arial" font-size="13" fill="#111827">ETS 2.28</text>
  <text x="712" y="506" font-family="Arial" font-size="13" fill="#111827">LightGBM 2.06</text>
  <text x="716" y="541" font-family="Arial" font-size="13" fill="#111827">Chronos-2 2.08</text>

  <g font-family="Arial" font-size="14" fill="#111827">
    <rect x="330" y="595" width="16" height="16" rx="2" fill="#2563eb"/><text x="354" y="608">ETS</text>
    <rect x="430" y="595" width="16" height="16" rx="2" fill="#16a34a"/><text x="454" y="608">LightGBM</text>
    <rect x="565" y="595" width="16" height="16" rx="2" fill="#f59e0b"/><text x="589" y="608">Chronos-2</text>
  </g>
</svg>