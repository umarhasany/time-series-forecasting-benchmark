<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600">
  <rect width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">Inference-Time Comparison</text>
  <text x="500" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#6b7280">Seconds for the 500-series, 28-day test forecast</text>

  <text x="110" y="130" font-family="Arial" font-size="19" font-weight="700" fill="#111827">Store-Item</text>
  <text x="110" y="350" font-family="Arial" font-size="19" font-weight="700" fill="#111827">M5</text>

  <!-- Store Item -->
  <text x="110" y="180" font-family="Arial" font-size="14" fill="#374151">ETS</text>
  <rect x="220" y="160" width="645" height="28" rx="5" fill="#2563eb"/>
  <text x="875" y="180" font-family="Arial" font-size="14" fill="#111827">21.46 s</text>

  <text x="110" y="230" font-family="Arial" font-size="14" fill="#374151">LightGBM</text>
  <rect x="220" y="210" width="18" height="28" rx="5" fill="#16a34a"/>
  <text x="248" y="230" font-family="Arial" font-size="14" fill="#111827">0.60 s</text>

  <text x="110" y="280" font-family="Arial" font-size="14" fill="#374151">Chronos-2</text>
  <rect x="220" y="260" width="215" height="28" rx="5" fill="#f59e0b"/>
  <text x="445" y="280" font-family="Arial" font-size="14" fill="#111827">7.15 s</text>

  <!-- M5 -->
  <text x="110" y="400" font-family="Arial" font-size="14" fill="#374151">ETS</text>
  <rect x="220" y="380" width="613" height="28" rx="5" fill="#2563eb"/>
  <text x="843" y="400" font-family="Arial" font-size="14" fill="#111827">20.44 s</text>

  <text x="110" y="450" font-family="Arial" font-size="14" fill="#374151">LightGBM</text>
  <rect x="220" y="430" width="15" height="28" rx="5" fill="#16a34a"/>
  <text x="245" y="450" font-family="Arial" font-size="14" fill="#111827">0.50 s</text>

  <text x="110" y="500" font-family="Arial" font-size="14" fill="#374151">Chronos-2</text>
  <rect x="220" y="480" width="180" height="28" rx="5" fill="#f59e0b"/>
  <text x="410" y="500" font-family="Arial" font-size="14" fill="#111827">5.99 s</text>

  <text x="500" y="560" text-anchor="middle" font-family="Arial" font-size="14" fill="#6b7280">LightGBM provides the lowest inference cost on both datasets.</text>
</svg>