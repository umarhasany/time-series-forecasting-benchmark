<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600">
  <rect width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">Store-Item Forecast Accuracy</text>
  <text x="500" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#6b7280">Lower is better across all metrics</text>

  <line x1="110" y1="500" x2="930" y2="500" stroke="#9ca3af"/>
  <line x1="110" y1="100" x2="110" y2="500" stroke="#9ca3af"/>

  <g font-family="Arial, sans-serif" font-size="13" fill="#6b7280">
    <text x="98" y="505" text-anchor="end">0</text>
    <text x="98" y="425" text-anchor="end">5</text>
    <text x="98" y="345" text-anchor="end">10</text>
    <text x="98" y="265" text-anchor="end">15</text>
    <text x="98" y="185" text-anchor="end">20</text>
    <text x="98" y="105" text-anchor="end">25</text>
  </g>
  <g stroke="#e5e7eb">
    <line x1="110" y1="420" x2="930" y2="420"/>
    <line x1="110" y1="340" x2="930" y2="340"/>
    <line x1="110" y1="260" x2="930" y2="260"/>
    <line x1="110" y1="180" x2="930" y2="180"/>
    <line x1="110" y1="100" x2="930" y2="100"/>
  </g>

  <!-- sMAPE -->
  <rect x="180" y="123.0" width="55" height="377.0" rx="4" fill="#2563eb"/>
  <rect x="245" y="276.2" width="55" height="223.8" rx="4" fill="#16a34a"/>
  <rect x="310" y="279.7" width="55" height="220.3" rx="4" fill="#f59e0b"/>
  <text x="272" y="535" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#111827">sMAPE (%)</text>

  <!-- WAPE -->
  <rect x="445" y="128.8" width="55" height="371.2" rx="4" fill="#2563eb"/>
  <rect x="510" y="301.8" width="55" height="198.2" rx="4" fill="#16a34a"/>
  <rect x="575" y="306.9" width="55" height="193.1" rx="4" fill="#f59e0b"/>
  <text x="537" y="535" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#111827">WAPE (%)</text>

  <!-- RMSE -->
  <rect x="710" y="299.0" width="55" height="201.0" rx="4" fill="#2563eb"/>
  <rect x="775" y="385.4" width="55" height="114.6" rx="4" fill="#16a34a"/>
  <rect x="840" y="388.9" width="55" height="111.1" rx="4" fill="#f59e0b"/>
  <text x="802" y="535" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#111827">RMSE</text>

  <g font-family="Arial" font-size="12" fill="#111827" text-anchor="middle">
    <text x="207" y="116">23.56</text><text x="272" y="269">13.99</text><text x="337" y="273">13.77</text>
    <text x="472" y="122">23.20</text><text x="537" y="295">12.39</text><text x="602" y="300">12.07</text>
    <text x="737" y="293">12.56</text><text x="802" y="379">7.16</text><text x="867" y="383">6.94</text>
  </g>

  <g font-family="Arial" font-size="14" fill="#111827">
    <rect x="330" y="565" width="16" height="16" rx="2" fill="#2563eb"/><text x="354" y="578">ETS</text>
    <rect x="430" y="565" width="16" height="16" rx="2" fill="#16a34a"/><text x="454" y="578">LightGBM</text>
    <rect x="565" y="565" width="16" height="16" rx="2" fill="#f59e0b"/><text x="589" y="578">Chronos-2</text>
